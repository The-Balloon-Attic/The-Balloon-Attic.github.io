<body>
    <!-- Hero Section -->
    <section id="hero" class="hero-section">
        <!-- Floating Balloons -->
        <div class="balloons-container">

            <div class="balloons-desktop">

                <div class="balloon balloon-4" style="--color: #b084a6; --size: 70px; --x: 18%; --y: 70%; --delay: 0.5s; --duration: 5.5s;"></div>
                <div class="balloon balloon-5" style="--color: #b8d5e8; --size: 85px; --x: 12%; --y: 82%; --delay: 0.6s; --duration: 4.8s;"></div>
                <div class="balloon balloon-6" style="--color: #f5e6a8; --size: 95px; --x: 22%; --y: 25%; --delay: 0.7s; --duration: 5.2s;"></div>

                <div class="balloon balloon-9" style="--color: #b084a6; --size: 92px; --x: 90%; --y: 58%; --delay: 0.5s; --duration: 4.9s;"></div>
                <div class="balloon balloon-10" style="--color: #d4c5d9; --size: 78px; --x: 85%; --y: 75%; --delay: 0.6s; --duration: 5.1s;"></div>
                <div class="balloon balloon-11" style="--color: #f5c2b8; --size: 82px; --x: 92%; --y: 28%; --delay: 0.8s; --duration: 4.6s;"></div>
                <div class="balloon balloon-12" style="--color: #b8d5e8; --size: 65px; --x: 3%; --y: 25%; --delay: 0.9s; --duration: 5.8s;"></div>
                <div class="balloon balloon-13" style="--color: #f5e6a8; --size: 72px; --x: 25%; --y: 8%; --delay: 1.0s; --duration: 4.2s;"></div>
            </div>
            
            <!-- Mobile balloons -->
            <div class="balloons-mobile">
                <div class="balloon balloon-m1" style="--color: #c5e5d3; --size: 70px; --x: 5%; --y: 12%; --delay: 0.2s; --duration: 4.5s;"></div>

            </div>
        </div>

        <!-- Hero Content -->
        <div class="hero-content">
            <!-- Attic House -->
            <div class="attic-house">
                <svg class="attic-svg" viewBox="0 0 320 220" role="img" aria-label="Attic house line art">
                    <!-- Roof / gable outline -->
                    <path class="stroke" d="M20 150 L160 40 L300 150"/>
                    <!-- Attic base line to hint the house body without drawing it fully -->
                    <path class="stroke" d="M52 150 H268"/>

                    <!-- Chimney -->
                    <path class="stroke" d="M220 78 v28"/>
                    <path class="stroke" d="M210 78 h24"/>

                    <!-- Attic window group -->
                    <g>
                        <!-- Outer arched window -->
                        <path class="fill-glass" d="M135 150 v-36 a25 25 0 0 1 50 0 v36 z"/>

                        <!-- Mullion -->
                        <path class="stroke" d="M160 150 v-54"/>
                        <path class="stroke" d="M135 132 h50"/>

                        <!-- Heart in the center -->
                        <g transform="translate(160 120)">
                            <path class="heart beat" d="M0 14
                                     c -7 0 -12 -5 -12 -11
                                     c 0 -10 12 -12 12 -3
                                     c 0 -9 12 -7 12 3
                                     c 0 6 -5 11 -12 11 z"/>
                        </g>
                    </g>

                    <!-- Subtle roof shading using a translucent polygon -->
                    <polygon points="160,40 300,150 260,150" fill="rgba(255,255,255,.35)"/>
                </svg>
            </div>
            
            <h1 class="hero-title">The Balloon Attic</h1>
            <p class="hero-subtitle">West Cork</p>
        </div>

        <!-- Scroll Indicator -->
        <div class="scroll-indicator">
            <div class="scroll-wheel">
                <div class="scroll-dot"></div>
            </div>
        </div>
    </section>

    <!-- Gallery Section -->

    ✨ Fully Automatic Gallery:
    • Just drop images into assets/images/ folder - no code changes needed!
    • To set featured images (first 5), edit scripts/main.js lines 73-78
    • System auto-discovers ALL images automatically
    • Supports 100+ images with smart loading
    -->
    <section id="gallery" class="gallery-section">
        <div class="container">
            <div class="section-header reveal-on-scroll">
                <h2 class="section-title">Gallery</h2>
                <p class="section-subtitle">Browse our balloon artistry creations</p>
            </div>

            <div class="gallery-container">
                <!-- Single Image View -->
                <div class="single-view" id="single-view">
                    <div class="single-wrapper">
                        <!-- Navigation arrows -->
                        <button class="gallery-nav gallery-nav-prev" id="single-prev" aria-label="Previous image">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="15,18 9,12 15,6"></polyline>
                            </svg>
                        </button>
                        
                        <div class="single-viewport">
                            <div class="single-image-container" id="single-container">
                                <!-- Single image will be displayed here -->
                                <div class="gallery-loading">
                                    <p>Loading gallery...</p>
                                </div>
                            </div>
                        </div>
                        
                        <button class="gallery-nav gallery-nav-next" id="single-next" aria-label="Next image">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="9,18 15,12 9,6"></polyline>
                            </svg>
                        </button>
                    </div>
                    
                    <!-- Gallery indicators -->
                    <div class="gallery-indicators" id="single-indicators"></div>
                </div>

                <!-- Grid View Button (underneath single view) -->
                <div class="gallery-controls">
                    <button class="grid-toggle-btn" id="grid-toggle" aria-label="Open grid view">
                        <svg class="grid-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="7" height="7" rx="1"/>
                            <rect x="14" y="3" width="7" height="7" rx="1"/>
                            <rect x="3" y="14" width="7" height="7" rx="1"/>
                            <rect x="14" y="14" width="7" height="7" rx="1"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- Grid View Modal -->
    <div id="grid-modal" class="grid-modal">
        <div class="grid-modal-content">
            <button class="grid-modal-close" id="grid-modal-close" aria-label="Close grid view">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
